<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HMLV 生产看板</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: 'Segoe UI', 'Microsoft YaHei', Arial, sans-serif;
  background: #0b1120;
  color: #e2e8f0;
  height: 100vh;
  overflow: hidden;
}
.header {
  background: linear-gradient(135deg, #111827 0%, #0f172a 100%);
  border-bottom: 1px solid rgba(56, 189, 248, 0.2);
  padding: 2px 16px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  height: 40px;
  box-shadow: 0 2px 12px rgba(0, 0, 0, 0.3);
  position: relative;
  z-index: 10;
}
.header::after {
  content: '';
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;
  height: 1px;
  background: linear-gradient(90deg, transparent, rgba(56, 189, 248, 0.4), transparent);
}
.header h1 {
  font-size: 20px;
  letter-spacing: 3px;
  font-weight: 700;
}
.header h1 .title-text {
  background: linear-gradient(135deg, #38bdf8, #818cf8);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}
#todayDateLabel {
  font-size: 22px;
  font-weight: 700;
  color: #38bdf8;
  letter-spacing: 1px;
  white-space: nowrap;
}
.header-right {
  display: flex;
  align-items: center;
  gap: 10px;
}
.refresh-info {
  font-size: 11px;
  color: #64748b;
  display: flex;
  align-items: center;
  gap: 6px;
}
.refresh-info span { color: #38bdf8; }
.btn {
  background: linear-gradient(135deg, #1e293b, #334155);
  color: #e2e8f0;
  border: 1px solid #475569;
  padding: 4px 12px;
  border-radius: 6px;
  cursor: pointer;
  font-size: 11px;
  transition: all 0.2s;
  font-weight: 500;
}
.btn:hover { background: #475569; border-color: #64748b; }
.btn-primary {
  background: linear-gradient(135deg, #0284c7, #0ea5e9);
  border-color: #0284c7;
}
.btn-primary:hover { background: linear-gradient(135deg, #0369a1, #0284c7); }
/* 日期筛选框：隐藏浏览器内置的"年/月/日"占位符 */
#dateFilterInput.no-value::-webkit-datetime-edit { color: transparent; }
#dateFilterInput::-webkit-datetime-edit { color: #e2e8f0; }
#dateFilterInput::-webkit-calendar-picker-indicator { filter: invert(1); }
select {
  background: #1e293b;
  color: #e2e8f0;
  border: 1px solid #475569;
  padding: 3px 8px;
  border-radius: 6px;
  font-size: 11px;
  cursor: pointer;
  transition: border-color 0.2s;
}
select:hover { border-color: #64748b; }
.refresh-status {
  display: inline-block;
  width: 7px; height: 7px;
  border-radius: 50%;
  background: #4ade80;
  margin-right: 3px;
  animation: pulse 2s infinite;
  box-shadow: 0 0 6px rgba(74, 222, 128, 0.5);
}
@keyframes pulse {
  0%, 100% { opacity: 1; box-shadow: 0 0 6px rgba(74, 222, 128, 0.5); }
  50% { opacity: 0.4; box-shadow: 0 0 2px rgba(74, 222, 128, 0.2); }
}
.main {
  padding: 6px 10px;
  height: calc(100vh - 40px);
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 6px;
}

/* Sections */
.section {
  background: linear-gradient(135deg, #111827 0%, #1e293b 100%);
  border: 1px solid rgba(51, 65, 85, 0.6);
  border-radius: 8px;
  overflow: visible;
  box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
}
.section-header {
  background: rgba(15, 23, 42, 0.8);
  padding: 2px 12px;
  font-size: 12px;
  font-weight: 600;
  color: #38bdf8;
  border-bottom: 1px solid rgba(51, 65, 85, 0.5);
  display: flex;
  justify-content: space-between;
  align-items: center;
  height: 24px;
}
.section-body { padding: 6px 10px; }

/* Station Table */
.station-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 12px;
}
.station-table th {
  text-align: left;
  padding: 4px 6px;
  color: #64748b;
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 1px;
  border-bottom: 1px solid rgba(51, 65, 85, 0.6);
  text-transform: uppercase;
}
.station-table td {
  padding: 4px 6px;
  border-bottom: 1px solid rgba(30, 41, 59, 0.6);
  vertical-align: middle;
}
.station-table tr:last-child td { border-bottom: none; }
.station-table tr:hover td { background: rgba(15, 23, 42, 0.5); }
.station-table tr:hover td.divider-cell { background: transparent; }

/* Divider columns */
.col-divider { width: 2px; padding: 0; }
.divider-col { width: 2px; }
.divider-cell {
  padding: 0 !important;
  width: 1px;
  min-width: 1px;
  border-left: 1px solid rgba(71, 85, 105, 0.5);
  border-right: none;
  background: transparent !important;
}
thead th.divider-cell {
  border-left: 1px solid rgba(100, 116, 139, 0.4);
  padding: 0;
}
thead th.divider-cell.has-line {
  border-bottom: 1px solid rgba(51, 65, 85, 0.6);
}

/* Progress Bar */
.progress-bar-wrap {
  background: rgba(15, 23, 42, 0.8);
  border-radius: 5px;
  height: 18px;
  overflow: hidden;
  width: 100%;
  position: relative;
  display: flex;
  align-items: center;
  border: 1px solid rgba(51, 65, 85, 0.3);
}
.progress-bar {
  height: 100%;
  border-radius: 5px;
  transition: width 0.6s ease;
  position: relative;
}
.progress-bar-text {
  position: absolute;
  right: 8px;
  top: 50%;
  transform: translateY(-50%);
  font-size: 11px;
  font-weight: 700;
  color: #fff;
  text-shadow: 0 1px 3px rgba(0,0,0,0.5);
  z-index: 1;
}
.progress-bar-text-left {
  position: absolute;
  left: 6px;
  top: 50%;
  transform: translateY(-50%);
  font-size: 11px;
  font-weight: 700;
  color: #fff;
  text-shadow: 0 1px 3px rgba(0,0,0,0.5);
  z-index: 1;
}
.rate-text {
  font-weight: 700;
  font-size: 12px;
  text-align: right;
  min-width: 40px;
}

canvas { display: block; background: transparent; }

.dot {
  display: inline-block;
  width: 10px; height: 10px;
  border-radius: 50%;
  margin-right: 6px;
  box-shadow: 0 0 6px currentColor;
  opacity: 0.9;
}

/* WIP Cards */
.wip-card {
  background: rgba(15, 23, 42, 0.6);
  border: 1px solid rgba(51, 65, 85, 0.5);
  border-radius: 8px;
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
  height: 380px;
  box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
  transition: border-color 0.2s;
  clip-path: inset(0 round 8px);
}
.wip-card:hover { border-color: rgba(71, 85, 105, 0.8); }
.wip-card-header {
  padding: 5px 10px;
  font-size: 11px;
  font-weight: 600;
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-bottom: 1px solid rgba(51, 65, 85, 0.4);
  color: #e2e8f0;
}
.wip-card-body {
  flex: 1;
  overflow-y: auto;
  font-size: 11px;
}
.wip-card-body::-webkit-scrollbar { width: 3px; }
.wip-card-body::-webkit-scrollbar-track { background: transparent; }
.wip-card-body::-webkit-scrollbar-thumb { background: #334155; border-radius: 2px; }
/* WIP表格 — 使用table布局保证列对齐（table-layout:fixed以表头为准） */
.wip-table { display: table; width: 100%; table-layout: fixed; border-collapse: collapse; }
.wip-table-header { display: table-header-group; position: sticky; top: 0; z-index: 2; background: #0f172a; }
.wip-table-body { display: table-row-group; }
.wip-row {
  display: table-row;
  transition: background 0.15s;
  font-size: 8px;
}
.wip-row:hover { background: rgba(30, 41, 59, 0.6); }
.wip-row:last-child .wip-col-job,
.wip-row:last-child .wip-col-item,
.wip-row:last-child .wip-col-line,
.wip-row:last-child .wip-dwell { border-bottom: none; }
.wip-table-header .wip-col-job,
.wip-table-header .wip-col-item,
.wip-table-header .wip-col-line,
.wip-table-header .wip-dwell {
  color: #94a3b8;
  font-size: 10px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  border-bottom: 1px solid rgba(51, 65, 85, 0.4);
}
.wip-col-job { display: table-cell; color: #e2e8f0; overflow: hidden; text-overflow: ellipsis; text-align: center; font-size: 9px; padding: 2px 4px; border-bottom: 1px solid rgba(30, 41, 59, 0.4); }
.wip-col-item { display: table-cell; color: #94a3b8; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; text-align: center; font-size: 9px; padding: 2px 4px; border-bottom: 1px solid rgba(30, 41, 59, 0.4); }
.wip-col-line { display: table-cell; color: #a78bfa; font-size: 7px; white-space: nowrap; text-align: center; padding: 2px 4px; border-bottom: 1px solid rgba(30, 41, 59, 0.4); }
.wip-dwell { display: table-cell; font-weight: 600; white-space: nowrap; text-align: center; font-size: 9px; padding: 2px 4px; border-bottom: 1px solid rgba(30, 41, 59, 0.4); }
.wip-dwell.warn { color: #f87171; }
.wip-dwell.ok { color: #4ade80; }
.wip-dwell.mid { color: #fbbf24; }

/* 格子竖线 */
.wip-col-job, .wip-col-item, .wip-col-line, .wip-dwell {
  border-left: 1px solid rgba(100, 116, 139, 0.5);
  border-right: 1px solid rgba(100, 116, 139, 0.5);
}
.wip-col-job { border-left: none; }
.wip-dwell { border-right: none; }

/* KPI Card Glow */
.kpi-card {
  position: relative;
  overflow: visible;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  min-height: 70px;
  padding: 6px 8px;
}
.kpi-card::before {
  content: '';
  position: absolute;
  top: 0;
  left: 50%;
  transform: translateX(-50%);
  width: 60%;
  height: 1px;
  background: linear-gradient(90deg, transparent, currentColor, transparent);
  opacity: 0.3;
}
.kpi-card .kpi-title {
  font-size: 11px;
  font-weight: 600;
  margin-bottom: 2px;
  letter-spacing: 1px;
  text-align: center;
}
.kpi-card .kpi-value {
  font-size: 24px;
  font-weight: 700;
  text-align: center;
}
</style>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
</head>
<body>

<div class="header">
  <h1><span class="title-text">HMLV生产看板</span></h1>
  <span id="todayDateLabel"><script>document.write((function(){var d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');})())</script></span>
  <div style="display:flex;align-items:center;gap:4px;">
    <label style="font-size:11px;color:#38bdf8;" data-i18n="date_filter_label">日期筛选</label>
    <input id="dateFilterInput" type="date" value="" placeholder="" class="no-value"
      style="background:rgba(15,23,42,0.8);color:#e2e8f0;caret-color:#ffffff;border:1px solid #475569;padding:4px 8px;border-radius:6px;font-size:11px;width:120px;outline:none;transition:border-color 0.2s;"
      onfocus="this.style.borderColor='#38bdf8'" onblur="this.style.borderColor='#475569'"
      onchange="onDateFilterChange(); this.classList.remove('no-value')">
    <button class="btn" onclick="clearDateFilter()" style="padding:2px 8px;font-size:10px;color:#f87171;" title="清除日期筛选">✕</button>
  </div>
  <select id="siteSelect">
    <option value="310">HMLV</option>
    <option value="410">Penang</option>
  </select>
  <div style="display:flex;align-items:center;gap:4px;">
    <input id="woSearchInput" type="text" placeholder="搜工单号..." autocomplete="off"
      style="background:rgba(15,23,42,0.8);color:#e2e8f0;border:1px solid #475569;padding:4px 10px;border-radius:6px;font-size:11px;width:130px;outline:none;transition:border-color 0.2s;"
      onfocus="this.style.borderColor='#38bdf8'" onblur="this.style.borderColor='#475569'"
      onkeydown="if(event.key==='Enter')searchWO()" data-i18n="search_placeholder">
    <button class="btn" onclick="searchWO()" style="padding:2px 8px;font-size:10px;">🔍</button>
    <button class="btn btn-primary" onclick="manualRefresh()" data-i18n="refresh_btn">刷新</button>
  </div>
  <div class="header-right">
    <div class="refresh-info">
      <span class="refresh-status" id="refreshDot"></span>
      <span data-i18n="refresh_label">自动刷新:</span> <span id="countdownText">30s</span>
      &nbsp;|&nbsp;
      <span data-i18n="current_time_label">当前时间:</span> <span id="updated_at">--:--:--</span>
      &nbsp;|&nbsp;
      <span data-i18n="total_prefix">共 </span><span id="total_records">--</span><span data-i18n="total_suffix"> 条</span>
    </div>
    <select id="intervalSelect">
      <option value="30" data-i18n="r30">30秒</option>
      <option value="60" data-i18n="r60">1分钟</option>
      <option value="300" selected data-i18n="r300">5分钟</option>
      <option value="600" data-i18n="r600">10分钟</option>
      <option value="0" data-i18n="r0">手动</option>
    </select>
  </div>
</div>

<!-- 工单查询弹窗 -->
<div id="woModal" style="display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.6);z-index:9999;align-items:center;justify-content:center;">
  <div style="background:#1e293b;border:1px solid #334155;border-radius:8px;width:560px;max-width:92vw;max-height:80vh;overflow-y:auto;box-shadow:0 8px 40px rgba(0,0,0,0.5);">
    <div style="display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:1px solid #334155;background:#0f172a;border-radius:8px 8px 0 0;">
      <span data-i18n="modal_wo" style="color:#38bdf8;font-size:14px;font-weight:700;">工单状态查询</span>
      <button onclick="closeWOModal()" style="background:none;border:none;color:#94a3b8;cursor:pointer;font-size:18px;line-height:1;padding:0 4px;">×</button>
    </div>
    <div id="woModalBody" style="padding:16px;"></div>
  </div>
</div>

<div id="excModal" style="display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.6);z-index:99999;align-items:center;justify-content:center;">
  <div style="background:#1e293b;border:1px solid #dc2626;border-radius:8px;width:480px;max-width:92vw;max-height:70vh;overflow-y:auto;box-shadow:0 8px 40px rgba(0,0,0,0.5);">
    <div style="display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:1px solid #dc262640;background:#7f1d1d;border-radius:8px 8px 0 0;">
      <span data-i18n="modal_exc" style="color:#fca5a5;font-size:14px;font-weight:700;">异常详情</span>
      <button onclick="closeExcModal()" style="background:none;border:none;color:#94a3b8;cursor:pointer;font-size:18px;line-height:1;padding:0 4px;">×</button>
    </div>
    <div id="excModalBody" style="padding:16px; color:#e2e8f0; font-size:13px; line-height:1.8;"></div>
  </div>
</div>

  <!-- KPI Cards Row (3 cards, centered over station progress 3 columns) -->
  <div id="kpiCardsRow" style="display:flex;flex-shrink:0;padding:0 8px;">

    <!-- 左侧占位：对齐工序进度表的"工序列" -->
    <div style="flex:8;flex-shrink:0;"></div>

    <!-- 左留白 -->
    <div style="flex:1;flex-shrink:0;"></div>

    <!-- ===== Card 1: 销售 ===== -->
    <div class="section" style="flex:20; display:flex; flex-direction:column; justify-content:center; padding:10px 12px; margin-right:4px;">
      <div style="display:flex; justify-content:center; align-items:baseline; gap:16px; padding:0;">
        <div style="font-size:15px; color:#a78bfa;"><span data-i18n="target_sales">目标销售：</span><span id="targetSalesValue" style="font-weight:700;color:#e2e8f0;font-size:17px;">-</span></div>
        <div style="font-size:15px; color:#a78bfa;"><span data-i18n="completion_rate">完成率：</span><span id="salesCompletionRate" style="font-weight:700;font-size:17px;">-</span></div>
      </div>
      <div style="text-align:center; padding:4px 0 2px; font-size:11px; color:#94a3b8;">
        <span data-i18n="released_sales">已释放销售：</span><span id="totalSalesDisplay" style="font-weight:600;color:#e2e8f0;">-</span>
      </div>
    </div>

    <!-- 间隔 -->
    <div style="flex:3;flex-shrink:0;"></div>

    <!-- ===== Card 2: 工单数量 ===== -->
    <div class="section" style="flex:20; display:flex; flex-direction:column; justify-content:center; padding:10px 12px; margin-right:4px;">
      <div style="display:flex; justify-content:center; align-items:baseline; gap:16px; padding:0;">
        <div style="font-size:15px; color:#38bdf8;"><span data-i18n="target_jobs">目标工单数量：</span><span id="targetJobsValue" style="font-weight:700;color:#e2e8f0;font-size:17px;">-</span></div>
        <div style="font-size:15px; color:#38bdf8;"><span data-i18n="completion_rate">完成率：</span><span id="jobsCompletionRate" style="font-weight:700;font-size:17px;">-</span></div>
      </div>
      <div style="text-align:center; padding:4px 0 2px; font-size:11px; color:#94a3b8;">
        <span data-i18n="released_jobs">已释放工单数量：</span><span id="totalJobsDisplay" style="font-weight:600;color:#e2e8f0;">-</span>
      </div>
    </div>

    <!-- 间隔 -->
    <div style="flex:3;flex-shrink:0;"></div>

    <!-- ===== Card 3: 工时 ===== -->
    <div class="section" style="flex:20; display:flex; flex-direction:column; justify-content:center; padding:10px 12px;">
      <div style="display:flex; justify-content:center; align-items:baseline; gap:16px; padding:0;">
        <div style="font-size:15px; color:#fb923c;"><span data-i18n="target_hours">目标工时：</span><span id="targetHoursValue" style="font-weight:700;color:#e2e8f0;font-size:17px;">-</span></div>
        <div style="font-size:15px; color:#fb923c;"><span data-i18n="completion_rate">完成率：</span><span id="hoursCompletionRate" style="font-weight:700;font-size:17px;">-</span></div>
      </div>
      <div style="text-align:center; padding:4px 0 2px; font-size:11px; color:#94a3b8;">
        <span data-i18n="released_hours">已释放工单工时：</span><span id="totalHoursDisplay" style="font-weight:600;color:#e2e8f0;">-</span>
      </div>
    </div>

  </div>

  <!-- Station Progress (table only, no inline metrics) -->
  <div class="section" style="flex:1;min-height:0;display:flex;flex-direction:column;">
    <div class="section-header">
      <span style="min-width:60px"></span>
      <span data-i18n="sec_progress" style="font-size:17px;font-weight:700">工序完成进度</span>
      <span style="min-width:60px"></span>
    </div>
    <div class="section-body" style="padding:4px 8px;flex:1;min-height:0;overflow-y:auto;">
      <table class="station-table" id="stationTable">
          <colgroup>
            <col style="width:10%">
            <col class="divider-col">
            <col style="width:8%">
            <col style="width:10%">
            <col style="width:12%">
            <col class="divider-col">
            <col style="width:8%">
            <col style="width:10%">
            <col style="width:12%">
            <col class="divider-col">
            <col style="width:5%">
            <col style="width:7%">
            <col style="width:12%">
          </colgroup>
        <thead>
          <tr>
            <th data-i18n="th_station">工序</th>
            <th class="divider-cell has-line"></th>
            <th data-i18n="th_today_sales">当日完成销售</th>
            <th data-i18n="th_sales">销售金额</th>
            <th data-i18n="th_sales_rate">销售完成率</th>
            <th class="divider-cell has-line"></th>
            <th data-i18n="th_today_jobs">当日完成工单</th>
            <th data-i18n="th_cum_jobs">累计完成工单</th>
            <th data-i18n="th_jobs_progress">工单进度</th>
            <th class="divider-cell has-line"></th>
            <th data-i18n="th_today_hours">今日完成工时</th>
            <th data-i18n="th_cum_hours">累计完成工时</th>
            <th data-i18n="th_hours_progress">工时进度</th>
          </tr>
        </thead>
        <tbody id="stationBody"></tbody>
      </table>
    </div>
  </div>

  <!-- Station WIP -->
  <div class="section" style="flex:1;min-height:0;display:flex;flex-direction:column;">
    <div class="section-header">
      <span style="min-width:60px"></span>
      <span data-i18n="sec_wip" style="font-size:17px;font-weight:700">工序WIP</span>
      <span style="min-width:60px"></span>
    </div>
    <div class="section-body" style="padding:4px 8px;flex:1;min-height:0;display:flex;flex-direction:column;">
      <div id="wipContainer" style="display:flex;gap:6px;flex-wrap:nowrap;overflow-x:auto;flex:1;min-height:0;"></div>
    </div>
  </div>

</div>


<script>
const STATION_COLORS = {
  Print:'#38bdf8', Cut:'#4ade80', Pre:'#facc15',
  Asm:'#fb923c', Test:'#f87171', Pack:'#2dd4bf'
};
let STATION_CN = {
  Print:'工单打印 Print', Cut:'剪线 Cut', Pre:'预处理 Pre',
  Asm:'组装 Asm', Test:'测试 Test', Pack:'包装 Pack'
};
const STATION_LIST = ['Print','Cut','Pre','Asm','Test','Pack'];
const DISPLAY_STATIONS = ['Cut','Pre','Asm','Test','Pack'];

let totalJobCount = 1;
let currentSite = '310';
const I18N = {
  '310': {
    title:'HMLV生产看板', page_title:'HMLV 生产看板',
    refresh_label:'自动刷新:', current_time_label:'当前时间:',
    total_prefix:'共 ', total_suffix:' 条',
    search_placeholder:'搜工单号...', refresh_btn:'刷新',
    modal_wo:'工单状态查询', modal_exc:'异常详情',
    target_sales:'目标销售：', completion_rate:'完成率：', released_sales:'已释放销售：',
    target_jobs:'目标工单数量：', released_jobs:'已释放工单数量：',
    target_hours:'目标工时：', released_hours:'已释放工单工时：',
    sec_progress:'工序完成进度', sec_wip:'工序WIP',
    th_station:'工序', th_today_sales:'当日完成销售', th_sales:'销售金额', th_sales_rate:'销售完成率',
    th_today_jobs:'当日完成工单', th_cum_jobs:'累计完成工单', th_jobs_progress:'工单进度',
    th_today_hours:'今日完成工时', th_cum_hours:'累计完成工时', th_hours_progress:'工时进度',
    date_filter_label:'日期筛选',
    wip_no_data:'暂无数据', wip_dwell:'滞留时间', wip_transferred:'已流转',
    wip_exc_tag:'异常', wip_exc_label:'异常',
    wo_searching:'查询中...', wo_failed:'查询失败: ', wo_not_found:'未找到工单 ',
    wo_net_error:'网络错误: ', wo_completed:'已完工', wo_in_progress:'进行中',
    exc_none:'无', exc_title:'异常 ', exc_station:'工位', exc_desc:'描述', exc_time:'开始时间', exc_active:'活跃', exc_resolved:'已解决',
    stations:{Print:'工单打印 Print',Cut:'剪线 Cut',Pre:'预处理 Pre',Asm:'组装 Asm',Test:'测试 Test',Pack:'包装 Pack'},
    r30:'30秒',r60:'1分钟',r300:'5分钟',r600:'10分钟',r0:'手动',
    load_failed:'加载失败: '
  },
  '410': {
    title:'Penang Production Kanban', page_title:'Penang Kanban',
    refresh_label:'Auto Refresh:', current_time_label:'Time:',
    total_prefix:'Total: ', total_suffix:' records',
    search_placeholder:'Search WO...', refresh_btn:'Refresh',
    modal_wo:'WO Status', modal_exc:'Exception Details',
    target_sales:'Target Sales:', completion_rate:'Completion:', released_sales:'Released Sales:',
    target_jobs:'Target Jobs:', released_jobs:'Released Jobs:',
    target_hours:'Target Hours:', released_hours:'Released Hours:',
    sec_progress:'Station Progress', sec_wip:'Station WIP',
    th_station:'Station', th_today_sales:'Today Sales', th_sales:'Sales Amt', th_sales_rate:'Sales %',
    th_today_jobs:'Today Jobs', th_cum_jobs:'Cum. Jobs', th_jobs_progress:'Jobs %',
    th_today_hours:'Today Hrs', th_cum_hours:'Cum. Hrs', th_hours_progress:'Hrs %',
    date_filter_label:'Date Filter',
    wip_no_data:'No Data', wip_dwell:'Dwell Time', wip_transferred:'Transferred',
    wip_exc_tag:'Exc', wip_exc_label:'Exc',
    wo_searching:'Searching...', wo_failed:'Query Failed: ', wo_not_found:'WO Not Found: ',
    wo_net_error:'Network Error: ', wo_completed:'Completed', wo_in_progress:'In Progress',
    exc_none:'None', exc_title:'Exception ', exc_station:'Station', exc_desc:'Description', exc_time:'Start Time', exc_active:'Active', exc_resolved:'Resolved',
    stations:{Print:'Print',Cut:'Cut',Pre:'Pre-treatment',Asm:'Assembly',Test:'Test',Pack:'Pack'},
    r30:'30s',r60:'1 min',r300:'5 min',r600:'10 min',r0:'Manual',
    load_failed:'Load Failed: '
  }
};
function t(k){ return (I18N[currentSite]||I18N['310'])[k] || k; }
function applyI18N(){
  document.querySelectorAll('[data-i18n]').forEach(el=>{
    const v=t(el.getAttribute('data-i18n'));
    if(el.tagName==='INPUT') el.placeholder=v;
    else if(el.tagName==='OPTION') el.textContent=v;
    else el.textContent=v;
  });
  document.title = t('page_title');
  STATION_CN = t('stations');
}

let excelJobsReady = false;  // 标记 excel_jobs 数据是否已加载
let pendingRenderAll = null; // 缓存 /api/data 返回的 json，等待 excel_jobs 就绪后渲染

// ========== Auto Refresh ==========
let autoTimer = null;
let refreshInterval = 30;
let countdown = 30;
let countdownTimer = null;

function loadData() {
  fetch('/api/data?t=' + Date.now() + '&site=' + currentSite)
    .then(r => r.json())
    .then(json => {
      if (excelJobsReady) {
        // excel_jobs 已就绪，直接渲染
        renderAll(json);
      } else {
        // excel_jobs 还没返回，缓存起来等待
        pendingRenderAll = json;
      }
    })
    .catch(e => {
      document.querySelector('.main').innerHTML = '<div style="background:#7f1d1d;border:1px solid #b91c1c;border-radius:8px;padding:20px;margin:20px;color:#fca5a5">' + t('load_failed') + e.message + '</div>';
    });
}

function loadExcelJobs() {
  var dateParam = '';
  var dateInput = document.getElementById('dateFilterInput');
  if (dateInput && dateInput.value) {
    dateParam = '&date=' + dateInput.value;
  }
  fetch('/api/excel_jobs?t=' + Date.now() + '&site=' + currentSite + dateParam)
    .then(r => r.json())
    .then(json => {
      if (json.success) {
        if (json.data && json.data.current_month) {
          totalJobCount = json.data.current_month.total || 1;
        }
        // 保存销售数据供其他函数使用
        if (json.data && json.data.sales) {
          window._totalSales = json.data.sales.total_sales || 0;
          window._salesData = json.data.sales;
        }
        // 保存当月工单数据
        if (json.data && json.data.current_month) {
          window._salesData = window._salesData || {};
          window._salesData._currentMonth = json.data.current_month;
          window._currentMonth = json.data.current_month;
        }
        // 保存工时数据
        if (json.data && json.data.asm_hours) {
          window._asmHours = json.data.asm_hours;
        }
        // 保存各工序销售
        if (json.data && json.data.station_sales) {
          window._stationSales = json.data.station_sales;
        }
        // 保存各工序工时 & 总工时
        if (json.data && json.data.station_hours) {
          window._stationHours = json.data.station_hours;
          window._totalHoursAll = json.data.total_hours_all || 0;
        }
        // 保存实时工时目标
        if (json.data && json.data.realtime_target_hours) {
          window._realtimeTargetHours = json.data.realtime_target_hours;
          window._dailyTargetHours = json.data.daily_target_hours;
          window._passedWorkDays = json.data.passed_workdays || 1;
        }
        // 保存各工序每日目标工时
        if (json.data && json.data.station_daily_target) {
          window._stationDailyTarget = json.data.station_daily_target;
        }
        // 保存各工序当日完成工时
        if (json.data && json.data.station_hours_today) {
          window._stationHoursToday = json.data.station_hours_today;
        }
        // 保存各工序当日完成销售
        if (json.data && json.data.station_sales_today) {
          window._stationSalesToday = json.data.station_sales_today;
        }
        // 保存各工序当日完成工单数量
        if (json.data && json.data.station_jobs_today) {
          window._stationJobsToday = json.data.station_jobs_today;
        }
        // 保存各工序累计完成工单数（截至筛选日期）
        if (json.data && json.data.station_jobs_cum) {
          window._stationJobsCum = json.data.station_jobs_cum;
        }
        // 保存当月工作日数
        if (json.data && json.data.workdays_in_month) {
          window._workdaysInMonth = json.data.workdays_in_month;
        }
        // 保存筛选日期并更新表头
        if (json.data && json.data.filter_date) {
          window._filterDate = json.data.filter_date;
          updateStationHeaders(json.data.filter_date);
        }

        // 标记 excel_jobs 数据已就绪
        excelJobsReady = true;

        renderExcelCards(json.data);
        renderSalesCards(json.data);
        renderAsmHoursDisplay(json.data);
        renderSalesTarget();  // 销售数据就绪后渲染目标卡片

        // 重新渲染工序完成进度表（日期筛选后累计数据也需要更新）
        if (_apiJson) {
          renderAll(_apiJson);
        }

        // 如果有缓存的 /api/data 数据，现在渲染工序表
        if (pendingRenderAll) {
          renderAll(pendingRenderAll);
          pendingRenderAll = null;
        }
      }
    })
    .catch(e => {
      console.error('Excel数据加载失败:', e);
      // 即使 excel_jobs 失败也标记就绪，避免永久阻塞
      excelJobsReady = true;
      if (pendingRenderAll) {
        renderAll(pendingRenderAll);
        pendingRenderAll = null;
      }
    });
}

function renderExcelCards(data) {
  // 大日期始终显示今天的日期，不受日期筛选影响
  const today = new Date();
  const y = today.getFullYear();
  const mo = String(today.getMonth() + 1).padStart(2, '0');
  const d = String(today.getDate()).padStart(2, '0');
  document.getElementById('todayDateLabel').textContent = y + '-' + mo + '-' + d;
  // 工单和工时的目标卡片由 renderAllTargets() 统一渲染
  if (window._targetJobs || window._targetHours || window._salesTarget) {
    renderAllTargets();
  }
}

function renderSalesCards(data) {
  if (!data || !data.sales) {
    return;
  }
  const s = data.sales;
  const totalSales = s.total_sales || 0;
  const fmt = (n) => '$' + Math.round(n).toLocaleString('en-US');
  // 右侧：当月已释放工单销售（所有释放工单）
  document.getElementById('totalSalesDisplay').textContent = fmt(totalSales);
  // 触发统一渲染（如果目标数据已就绪）
  if (window._salesTarget) {
    renderAllTargets();
  }
}

// 工时数据保存到 window，由 renderAllTargets() 统一渲染
function renderAsmHoursDisplay(data) {
  // 工时目标卡片由 renderAllTargets() 处理，这里只触发
  if (window._targetJobs || window._targetHours || window._salesTarget) {
    renderAllTargets();
  }
}

// ========== 当月目标数据（销售+工单+工时）==========
function loadSalesTarget() {
  fetch('/api/sales-target?t=' + Date.now() + '&site=' + currentSite)
    .then(r => r.json())
    .then(json => {
      if (json.success) {
        window._salesTarget = json.target || 0;
        window._targetJobs = json.target_jobs || 0;
        window._targetHours = json.target_hours || 0;
        // 目标数据就绪后，如果已有销售数据就渲染所有卡片
        renderAllTargets();
      }
    })
    .catch(e => console.error('目标数据加载失败:', e));
}

// 统一渲染三个目标卡片
function renderAllTargets() {
  if (!window._salesData) return;
  // 销售卡片
  renderSalesTarget();
  // 工单卡片
  renderJobsTarget();
  // 工时卡片
  renderHoursTarget();
}

function renderSalesTarget() {
  const target = window._salesTarget || 0;
  const completedSales = (window._stationSales && window._stationSales['Pack']) || 0;
  const releasedSales = window._totalSales || 0;
  const fmt = (n) => '$' + Math.round(n).toLocaleString('en-US');

  document.getElementById('targetSalesValue').textContent = fmt(target);
  document.getElementById('totalSalesDisplay').textContent = fmt(releasedSales);

  const rateEl = document.getElementById('salesCompletionRate');
  if (target > 0) {
    const rate = Math.round(completedSales / target * 100);
    if (rateEl) rateEl.textContent = Math.min(rate, 999) + '%';
  } else {
    if (rateEl) rateEl.textContent = '-';
  }
}

function renderJobsTarget() {
  const target = window._targetJobs || 0;
  const completed = window._packCompletedJobs || 0;
  const released = (window._salesData && window._currentMonth && window._currentMonth.total) || 0;

  document.getElementById('targetJobsValue').textContent = target || '-';
  document.getElementById('totalJobsDisplay').textContent = released;

  const rateEl = document.getElementById('jobsCompletionRate');
  if (target > 0) {
    const rate = Math.round(completed / target * 100);
    if (rateEl) rateEl.textContent = Math.min(rate, 999) + '%';
  } else {
    if (rateEl) rateEl.textContent = '-';
  }
}

function renderHoursTarget() {
  const target = window._targetHours || 0;
  const completed = (window._stationHours && window._stationHours['Pack']) || 0;
  const released = (window._asmHours && window._asmHours.total_hours) || 0;

  document.getElementById('targetHoursValue').textContent = target > 0 ? target.toFixed(2) + ' H' : '-';
  document.getElementById('totalHoursDisplay').textContent = released.toFixed(2) + ' H';

  const rateEl = document.getElementById('hoursCompletionRate');
  if (target > 0) {
    const rate = Math.round(completed / target * 100);
    if (rateEl) rateEl.textContent = Math.min(rate, 999) + '%';
  } else {
    if (rateEl) rateEl.textContent = '-';
  }
}

function manualRefresh() {
  loadData();
  loadExcelJobs();
  loadWIP();
  loadSalesTarget();
}

function resetCountdown() {
  countdown = refreshInterval;
  document.getElementById('countdownText').textContent = refreshInterval > 0 ? countdown + 's' : '--';
}

function startAutoRefresh(sec) {
  refreshInterval = sec;
  if (autoTimer) { clearInterval(autoTimer); autoTimer = null; }
  if (countdownTimer) { clearInterval(countdownTimer); countdownTimer = null; }

  const dot = document.getElementById('refreshDot');
  if (sec > 0) {
    dot.style.background = '#4ade80';
    autoTimer = setInterval(function(){ loadData(); loadExcelJobs(); loadWIP(); }, sec * 1000);
    countdown = sec;
    countdownTimer = setInterval(() => {
      countdown--;
      if (countdown < 0) countdown = sec;
      document.getElementById('countdownText').textContent = countdown + 's';
    }, 1000);
  } else {
    dot.style.background = '#64748b';
    dot.style.animation = 'none';
    document.getElementById('countdownText').textContent = '--';
  }
}

document.getElementById('intervalSelect').addEventListener('change', e => {
  startAutoRefresh(parseInt(e.target.value));
});

document.getElementById('siteSelect').addEventListener('change', function() {
  currentSite = this.value;
  applyI18N();
  document.querySelector('.title-text').textContent = t('title');
  manualRefresh();
});

// ========== Render ==========
let _apiJson = null;

function renderAll(json) {
  _apiJson = json;

  document.getElementById('updated_at').textContent = json.updated_at || '--';
  document.getElementById('total_records').textContent = (json.kpi && json.kpi.total_records) || json.total_records || 0;

  // 工序完成进度 将 API 返回的扁平结构重新整理为前端期望的 stats 格式
  const stationStats = json.station_stats || [];

  // 构造 all.job_by_station：从 station_stats 数组里读完成数（当月数据）
  const jobByStation = {};
  stationStats.forEach(s => {
    jobByStation[s.station] = s.done;
  });

  // 缓存Pack完成工单数，供KPI卡片复用（确保与工序进度表一致）
  window._packCompletedJobs = jobByStation['Pack'] || 0;

  const stats = {
    updated_at: json.updated_at,
    all: { job_by_station: jobByStation, by_station: jobByStation }
  };

  renderStationTable(stats);

  // /api/data 返回后，Pack工单数已就绪，重新渲染KPI卡片确保一致
  if (window._salesData) {
    renderAllTargets();
  }
}

// ========== 日期筛选相关函数 ==========
function updateStationHeaders(filterDate) {
  // 根据筛选日期更新工序完成进度表头中的"当日"列标题
  var today = new Date();
  var todayStr = today.getFullYear() + '-' + String(today.getMonth()+1).padStart(2,'0') + '-' + String(today.getDate()).padStart(2,'0');
  var isToday = (filterDate === todayStr);

  // 格式化日期为显示格式
  var parts = filterDate.split('-');
  var displayDate = parts[1] + '/' + parts[2];  // MM/DD 格式
  var displayDateCN = parseInt(parts[1]) + '月' + parseInt(parts[2]) + '日';

  // 更新表头
  var thTodaySales = document.querySelector('th[data-i18n="th_today_sales"]');
  var thTodayJobs = document.querySelector('th[data-i18n="th_today_jobs"]');
  var thTodayHours = document.querySelector('th[data-i18n="th_today_hours"]');

  if (thTodaySales) {
    if (isToday) {
      thTodaySales.textContent = currentLang === 'en' ? 'Today Sales' : '当日完成销售';
    } else {
      thTodaySales.textContent = currentLang === 'en' ? displayDate + ' Sales' : displayDateCN + '完成销售';
    }
  }
  if (thTodayJobs) {
    if (isToday) {
      thTodayJobs.textContent = currentLang === 'en' ? 'Today Jobs' : '当日完成工单';
    } else {
      thTodayJobs.textContent = currentLang === 'en' ? displayDate + ' Jobs' : displayDateCN + '完成工单';
    }
  }
  if (thTodayHours) {
    if (isToday) {
      thTodayHours.textContent = currentLang === 'en' ? 'Today Hours' : '今日完成工时';
    } else {
      thTodayHours.textContent = currentLang === 'en' ? displayDate + ' Hours' : displayDateCN + '完成工时';
    }
  }
}

function onDateFilterChange() {
  // 日期选择变化时，重新加载 excel_jobs 数据
  loadExcelJobs();
}

function clearDateFilter() {
  // 清除日期筛选，恢复为当天
  var dateInput = document.getElementById('dateFilterInput');
  if (dateInput) {
    dateInput.value = '';
    dateInput.classList.add('no-value');
  }
  loadExcelJobs();
}

function renderStationTable(stats) {
  const tbody = document.getElementById('stationBody');
  tbody.innerHTML = '';

  // ===== 进度分母：全部使用数据库目标值 =====
  const targetSales = window._salesTarget || 0;      // 目标销售（来自 /api/sales-target）
  const targetJobs = window._targetJobs || 0;        // 目标工单数量（来自 /api/sales-target）
  const targetHours = window._targetHours || 0;      // 目标总工时（来自 /api/sales-target）

  // 从 all.by_station 或 stationJobsCum 获取累计完成工单数
  // 当有日期筛选（非今天）时，使用 excel_jobs 返回的 station_jobs_cum（截至筛选日期的累计）
  // 否则使用 /api/data 返回的 by_station（当天全部累计）
  var today = new Date();
  var todayStr = today.getFullYear() + '-' + String(today.getMonth()+1).padStart(2,'0') + '-' + String(today.getDate()).padStart(2,'0');
  var isFilterToday = (window._filterDate === todayStr);

  const byStationDefault = stats.all?.by_station || {};
  const byStation = isFilterToday ? byStationDefault : (window._stationJobsCum || byStationDefault);

  // 调试：打印数据
  console.log('[DEBUG] byStation:', byStation, 'isFilterToday:', isFilterToday, 'filterDate:', window._filterDate);
  console.log('[DEBUG] 目标值 → 销售:', targetSales, '工单:', targetJobs, '工时:', targetHours);

  const stationSales = window._stationSales || {};
  const stationHours = window._stationHours || {};
  const stationHoursToday = window._stationHoursToday || {};
  const stationSalesToday = window._stationSalesToday || {};
  const stationJobsToday = window._stationJobsToday || {};
  // 进度条颜色统一使用对应数值列的颜色，不再与时间目标比较

  DISPLAY_STATIONS.forEach(st => {
    const all = byStation[st] || 0;
    const color = STATION_COLORS[st] || '#94a3b8';

    // ===== 工单进度：已完成工单 / 目标工单数量 =====
    const pct = targetJobs > 0 ? Math.round((all / targetJobs) * 100) : 0;

    // ===== 工时计算 =====
    const todayHours = stationHoursToday[st] || 0;
    const cumHours = stationHours[st] || 0;
    // 工时进度：累计完成工时 / 目标总工时
    const hoursRate = targetHours > 0 ? Math.round((cumHours / targetHours) * 100) : 0;
    // 进度条宽度
    const actualBarWidth = Math.min(hoursRate, 100);
    // 工时进度条颜色：与工时数值列一致
    const hoursBarColor = '#60a5fa';

    // ===== 销售完成率：已完成销售 / 目标销售 =====
    const salesVal = stationSales[st] || 0;
    const stationSalesRate = targetSales > 0 ? Math.round((salesVal / targetSales) * 100) : 0;
    const salesBarWidth = Math.min(stationSalesRate, 100);

    // ===== 工单进度条宽度 =====
    const jobsBarWidth = Math.min(pct, 100);

    // 销售进度条颜色：与销售数值列一致
    const salesBarColor = '#a78bfa';

    // 工单进度条颜色：与工单数值列一致
    const jobsBarColor = '#e2e8f0';

    const tr = document.createElement('tr');
    tr.innerHTML =
      '<td><span class="dot" style="background:' + color + '"></span><strong>' + (STATION_CN[st] || st) + '</strong></td>' +
      '<td class="divider-cell"></td>' +
      '<td style="color:#a78bfa;font-weight:600;font-size:13px;">' + (stationSalesToday[st] > 0 ? '$' + stationSalesToday[st].toLocaleString('en-US', {minimumFractionDigits: 2}) : '-') + '</td>' +
      '<td style="color:#a78bfa;font-weight:600">' + (salesVal > 0 ? '$' + salesVal.toLocaleString('en-US', {minimumFractionDigits: 2}) : '-') + '</td>' +
      '<td style="display:flex;align-items:center;gap:4px;">' +
        '<span style="font-size:12px;font-weight:600;color:' + salesBarColor + ';min-width:32px;text-align:right;">' + stationSalesRate + '%</span>' +
        '<div class="progress-bar-wrap" style="height:20px;position:relative;flex:1;overflow:visible;">' +
          '<div class="progress-bar" style="width:' + salesBarWidth + '%;background:' + salesBarColor + ';"></div>' +
          '' +
        '</div>' +
      '</td>' +
      '<td class="divider-cell"></td>' +
      '<td style="font-weight:600;font-size:13px;">' + (stationJobsToday[st] || 0) + '</td>' +
      '<td><strong>' + all + '</strong></td>' +
      '<td style="display:flex;align-items:center;gap:4px;">' +
        '<span style="font-size:12px;font-weight:600;color:' + jobsBarColor + ';min-width:32px;text-align:right;">' + pct + '%</span>' +
        '<div class="progress-bar-wrap" style="height:20px;position:relative;flex:1;overflow:visible;">' +
          '<div class="progress-bar" style="width:' + jobsBarWidth + '%;background:' + jobsBarColor + ';"></div>' +
          '' +
        '</div>' +
      '</td>' +
      '<td class="divider-cell"></td>' +
      '<td style="color:#60a5fa;font-weight:600;font-size:13px;">' + todayHours.toFixed(1) + '</td>' +
      '<td style="color:#60a5fa;font-weight:600;font-size:13px;">' + cumHours.toFixed(1) + '</td>' +
      '<td style="display:flex;align-items:center;gap:4px;">' +
        '<span style="font-size:12px;font-weight:600;color:' + hoursBarColor + ';min-width:32px;text-align:right;">' + hoursRate + '%</span>' +
        '<div class="progress-bar-wrap" style="height:20px;position:relative;flex:1;overflow:visible;">' +
          '<div class="progress-bar" style="width:' + actualBarWidth + '%;background:' + hoursBarColor + ';"></div>' +
          '' +
        '</div>' +
      '</td>';
    tbody.appendChild(tr);
  });
}




// ========== WIP ==========
function loadWIP() {
  fetch('/api/wip?t=' + Date.now() + '&site=' + currentSite)
    .then(r => r.json())
    .then(json => {
      if (json.success) {
        window._wipData = json.data;
        renderWIP(json.data);
      }
    })
    .catch(e => console.error('WIP数据加载失败:', e));
}

function renderWIP(data) {
  const container = document.getElementById('wipContainer');
  if (!container) return;
  container.innerHTML = '';

  // 构建全局异常数据映射（按job查找）
  window._excData = {};

  const displayStations = ['Cut','Pre','Asm','Test','Pack'];
  displayStations.forEach(st => {
    const stData = data[st];
    if (!stData) {
      // 如果该工序没有数据，创建一个空卡片
      const card = document.createElement('div');
      card.className = 'wip-card';
      card.style.borderTop = '3px solid ' + (STATION_COLORS[st] || '#94a3b8');
      card.innerHTML = `
        <div class="wip-card-header" style="background:${STATION_COLORS[st] || '#94a3b8'}15;color:${STATION_COLORS[st] || '#94a3b8'};font-weight:600;">
          <span>${STATION_CN[st] || st}</span>
          <span style="background:${STATION_COLORS[st] || '#94a3b8'}30;color:${STATION_COLORS[st] || '#94a3b8'};border-radius:12px;padding:2px 10px;font-size:12px;font-weight:700;">0</span>
        </div>
        <div class="wip-card-body" style="display:flex;align-items:center;justify-content:center;color:#475569;font-size:11px;padding:20px;text-align:center;">
          ${t('wip_no_data')}
        </div>
      `;
      container.appendChild(card);
      return;
    }
    const color = STATION_COLORS[st] || '#94a3b8';
    const jobs = stData.jobs || [];  // 从 stData 获取 jobs 数组
    const count = stData.count || 0;      // 5月滞留数

    const card = document.createElement('div');
    card.className = 'wip-card';
    card.style.borderTop = '3px solid ' + color;

    let rowsHtml = '';
    // 异常工单置顶，其余按滞留时间降序
    const sortedJobs = jobs.slice().sort((a, b) => {
      const aExc = a.exception && a.exception.length > 0 ? 0 : 1;
      const bExc = b.exception && b.exception.length > 0 ? 0 : 1;
      return aExc - bExc;
    });
    sortedJobs.forEach(j => {
      const isExc = j.exception && j.exception.length > 0;
      // 存储异常数据，供点击事件查找
      if (isExc) window._excData[j.job] = j.exception;
      let cls = 'ok';
      if (j.dwell_hours > 160) cls = 'warn';
      else if (j.dwell_hours > 56) cls = 'mid';
      const dwellStr = j.dwell_hours.toFixed(1) + 'H';
      const itemText = j.item || '';
      const isTransferred = j.transferred;
      let rowStyle = isExc ? 'background:#7f1d1d;' : '';
      if (isTransferred) rowStyle += 'opacity:0.85;';
      const dwellColor = isExc ? 'color:#fca5a5;' : (cls === 'warn' ? 'color:#f87171;' : cls === 'mid' ? 'color:#fbbf24;' : 'color:#4ade80;');
      const dwellText = isTransferred ? t('wip_transferred') : dwellStr;
      const excBtn = isExc ? '<span class="exc-tag" data-job="' + escHtml(j.job) + '" style="background:#dc2626;color:#fff;padding:1px 5px;border-radius:3px;font-size:7px;margin-left:3px;cursor:pointer;white-space:nowrap;">' + t('wip_exc_tag') + '</span>' : '';
      rowsHtml += '<div class="wip-row" style="' + rowStyle + '"><span class="wip-col-job" style="' + (isExc ? 'color:#fca5a5;' : '') + '">' + escHtml(j.job) + excBtn + '</span><span class="wip-col-item">' + escHtml(itemText) + '</span><span class="wip-col-line">' + escHtml(j.line || '') + '</span><span class="wip-dwell" style="' + dwellColor + '">' + dwellText + '</span></div>';
    });

    card.innerHTML = `
      <div class="wip-card-header" style="background:${color}15;color:${color};font-weight:600;">
        <span>${STATION_CN[st] || st}</span>
        <span style="background:${color}30;color:${color};border-radius:12px;padding:2px 10px;font-size:12px;font-weight:700;">${count}</span>
        ${(stData.exception_count || 0) > 0 ? '<span style="background:#dc2626;color:#fff;border-radius:12px;padding:2px 10px;font-size:12px;font-weight:700;margin-left:4px;">' + t('wip_exc_label') + stData.exception_count + '</span>' : ''}
      </div>
      <div class="wip-card-body">
        <div class="wip-table">
          <div class="wip-table-header">
            <span class="wip-col-job" style="width:30%;">JOB</span>
            <span class="wip-col-item" style="width:36%;">Item</span>
            <span class="wip-col-line" style="width:14%;">Line</span>
            <span class="wip-dwell" style="width:20%;">${t('wip_dwell')}</span>
          </div>
          ${rowsHtml}
        </div>
      </div>
    `;
    container.appendChild(card);
  });
}


// ========== 工单查询 ==========
function searchWO() {
  const q = (document.getElementById('woSearchInput').value || '').trim();
  if (!q) return;
  const body = document.getElementById('woModalBody');
  body.innerHTML = '<div style="text-align:center;color:#94a3b8;padding:24px;">' + t('wo_searching') + '</div>';
  document.getElementById('woModal').style.display = 'flex';

  fetch('/api/search_wo?q=' + encodeURIComponent(q) + '&site=' + currentSite + '&t=' + Date.now())
    .then(r => r.json())
    .then(json => {
      if (!json.success) {
        body.innerHTML = '<div style="color:#f87171;padding:12px;">' + t('wo_failed') + json.error + '</div>';
        return;
      }
      if (!json.found || !json.results.length) {
        body.innerHTML = '<div style="color:#fbbf24;text-align:center;padding:24px;">' + t('wo_not_found') + '<strong>' + escHtml(q) + '</strong></div>';
        return;
      }

      const STEP_COLORS = {
        Print:'#38bdf8', Cut:'#4ade80', Pre:'#facc15',
        Asm:'#fb923c', Test:'#f87171', Pack:'#2dd4bf'
      };

      let html = '';
      json.results.forEach(r => {
        const isCompleted = r.current_status === t('wo_completed') || r.current_status === '已完工';
        const isInProgress = r.current_status === t('wo_in_progress') || r.current_status === '进行中';
        const statusColor = isCompleted ? '#4ade80' : isInProgress ? '#fb923c' : '#94a3b8';
        const lineTag = r.line ? `<span style="color:#a78bfa;font-size:11px;background:#a78bfa22;padding:1px 8px;border-radius:8px;margin-left:8px;">${escHtml(r.line)}</span>` : '';
        // 异常标签
        let excHtml = '';
        if (r.exceptions && r.exceptions.length > 0) {
          window._excData[r.job] = r.exceptions;
          const activeCount = r.exceptions.filter(e => e.active).length;
          const totalCount = r.exceptions.length;
          const excColor = activeCount > 0 ? '#dc2626' : '#f59e0b';
          const excText = activeCount > 0 ? (activeCount < totalCount ? `异常 ${activeCount}/${totalCount}` : `异常 ${activeCount}`) : `已解决 ${totalCount}`;
          excHtml = `<span class="exc-tag" data-job="${escHtml(r.job)}" style="background:${excColor}22;color:${excColor};padding:2px 8px;border-radius:10px;font-size:11px;margin-left:8px;cursor:pointer;border:1px solid ${excColor}44;">⚠ ${excText}</span>`;
        }
        // item 显示
        const itemText = r.item ? `<span style="color:#94a3b8;font-size:11px;margin-left:8px;">Item: ${escHtml(r.item)}</span>` : '';
        html += `<div style="margin-bottom:20px;border:1px solid #334155;border-radius:6px;overflow:hidden;">
          <div style="padding:8px 12px;background:#0f172a;display:flex;justify-content:space-between;align-items:center;">
            <div style="display:flex;align-items:center;flex-wrap:wrap;gap:4px;">
              <span style="color:#e2e8f0;font-size:13px;font-weight:700;">${escHtml(r.job)}</span>${itemText}${lineTag}${excHtml}
            </div>
            <span style="color:${statusColor};font-size:12px;font-weight:600;background:${statusColor}22;padding:2px 10px;border-radius:10px;flex-shrink:0;margin-left:8px;">${r.current_status} → ${r.current_station}</span>
          </div>
          <div style="padding:12px 12px 8px;">`;

        // 流程步骤图
        html += '<div style="display:flex;align-items:center;gap:0;overflow-x:auto;padding-bottom:4px;">';
        r.steps.forEach((step, idx) => {
          const c = STEP_COLORS[step.station] || '#94a3b8';
          const opacity = step.done ? '1' : '0.3';
          html += `<div style="display:flex;flex-direction:column;align-items:center;min-width:68px;opacity:${opacity};">
            <div style="width:32px;height:32px;border-radius:50%;background:${c};display:flex;align-items:center;justify-content:center;font-size:14px;color:#0f172a;font-weight:700;">${step.done ? '✓' : (idx + 1)}</div>
            <div style="color:${c};font-size:11px;margin-top:4px;text-align:center;white-space:nowrap;">${escHtml(step.label)}</div>
            <div style="color:#64748b;font-size:10px;margin-top:2px;text-align:center;">${step.done ? step.complete_time.slice(0,10) : '--'}</div>
          </div>`;
          if (idx < r.steps.length - 1) {
            const nextDone = r.steps[idx+1] && r.steps[idx+1].done;
            html += `<div style="flex:1;height:2px;background:${nextDone ? '#334155' : '#1e293b'};min-width:10px;margin-bottom:18px;"></div>`;
          }
        });
        html += '</div>';
        html += '</div></div>';
      });

      body.innerHTML = html;
    })
    .catch(e => {
      body.innerHTML = '<div style="color:#f87171;padding:12px;">' + t('wo_net_error') + e.message + '</div>';
    });
}

function closeWOModal() {
  document.getElementById('woModal').style.display = 'none';
}

function closeExcModal() {
  document.getElementById('excModal').style.display = 'none';
}
document.addEventListener('DOMContentLoaded', function() {
  document.getElementById('woModal').addEventListener('click', function(e) {
    if (e.target === this) closeWOModal();
  });
  document.getElementById('excModal').addEventListener('click', function(e) {
    if (e.target === this) closeExcModal();
  });
  // 异常标签点击委托
  document.addEventListener('click', function(e) {
    var tag = e.target.closest('.exc-tag');
    if (tag) {
      var job = tag.getAttribute('data-job');
      if (job) showExcModal(job);
    }
  });
});

function showExcModal(job) {
  var excList = window._excData[job] || [];
  var jobData = null;
  var stations = ['Cut','Pre','Asm','Test','Pack'];
  for (var s = 0; s < stations.length; s++) {
    var stData = window._wipData && window._wipData[stations[s]];
    if (!stData || !stData.jobs) continue;
    for (var i = 0; i < stData.jobs.length; i++) {
      if (stData.jobs[i].job === job) { jobData = stData.jobs[i]; break; }
    }
    if (jobData) break;
  }
  // 如果 _wipData 中找不到（如搜索已完工工单），从异常数据本身提取信息
  var itemText = jobData ? (jobData.item || '') : '';
  var lineText = jobData ? (jobData.line || '') : '';
  var body = document.getElementById('excModalBody');
  var html = '<div style="margin-bottom:12px;padding:10px;background:#0f172a;border-radius:6px;border-left:3px solid #dc2626;">';
  html += '<div style="color:#e2e8f0;font-weight:700;font-size:15px;margin-bottom:6px;">' + escHtml(job) + '</div>';
  html += '<div style="color:#94a3b8;font-size:12px;margin-bottom:10px;">Item: ' + escHtml(itemText || t('exc_none')) + ' &nbsp;|&nbsp; Line: ' + escHtml(lineText || t('exc_none')) + '</div>';
  html += '</div>';
  excList.forEach(function(e, idx) {
    var badgeBg = e.active ? '#dc2626' : '#f59e0b';
    var badgeText = e.active ? t('exc_active') : t('exc_resolved');
    html += '<div style="padding:10px;background:#7f1d1d22;border-radius:6px;margin-bottom:8px;border-left:3px solid ' + badgeBg + ';">';
    html += '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;">';
    html += '<span style="color:#fca5a5;font-weight:600;">\u26a0 ' + t('exc_title') + (idx + 1) + '</span>';
    html += '<span style="background:' + badgeBg + '22;color:' + badgeBg + ';padding:1px 8px;border-radius:8px;font-size:10px;border:1px solid ' + badgeBg + '44;">' + badgeText + '</span>';
    html += '</div>';
    html += '<div style="margin-bottom:4px;"><span style="color:#94a3b8;display:inline-block;width:70px;">' + t('exc_station') + '</span><span style="color:#e2e8f0;">' + escHtml(e.station) + '</span></div>';
    html += '<div style="margin-bottom:4px;"><span style="color:#94a3b8;display:inline-block;width:70px;">' + t('exc_desc') + '</span><span style="color:#fca5a5;">' + escHtml(e.description) + '</span></div>';
    html += '<div><span style="color:#94a3b8;display:inline-block;width:70px;">' + t('exc_time') + '</span><span style="color:#e2e8f0;">' + escHtml(e.start_time) + '</span></div>';
    html += '</div>';
  });
  body.innerHTML = html;
  document.getElementById('excModal').style.display = 'flex';
}

function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}


// 实时时钟
function updateClock() {
  const now = new Date();
  const h = String(now.getHours()).padStart(2, '0');
  const m = String(now.getMinutes()).padStart(2, '0');
  const s = String(now.getSeconds()).padStart(2, '0');
  document.getElementById('updated_at').textContent = h + ':' + m + ':' + s;
}
setInterval(updateClock, 1000);
updateClock();

loadData();
loadExcelJobs();
loadWIP();
loadSalesTarget();
startAutoRefresh(300);
applyI18N();
</script>
